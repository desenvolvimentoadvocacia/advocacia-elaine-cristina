<title>Relatórios | Elaine Cristina Advocacia</title>
<style>
  :root {
    --paper: #f2f4f9;
    --paper-raised: #ffffff;
    --ink: #0f1e33;
    --ink-soft: #4c5872;
    --ink-faint: #848da3;
    --navy: #003375;
    --gold: #93813f;
    --line: #dbe1ec;
    --line-strong: #c1cbdf;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0d1522; --paper-raised: #141d2e; --ink: #e8ecf3; --ink-soft: #aab3c4; --ink-faint: #737e93;
      --navy: #7fa3d6; --gold: #d9cf95; --line: #263145; --line-strong: #37445c;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0d1522; --paper-raised: #141d2e; --ink: #e8ecf3; --ink-soft: #aab3c4; --ink-faint: #737e93;
    --navy: #7fa3d6; --gold: #d9cf95; --line: #263145; --line-strong: #37445c;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    background: var(--paper); color: var(--ink); margin: 0;
    font-family: "Public Sans", -apple-system, "Segoe UI", sans-serif; line-height: 1.55;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 64px 28px 80px; }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--gold);
  }
  h1 { font-family: "Playfair Display", Georgia, serif; font-size: 30px; margin: 8px 0 6px; }
  .subtitle { color: var(--ink-soft); font-size: 15px; margin-bottom: 40px; max-width: 46ch; }
  .reco-list { border-top: 1px solid var(--line); }
  a.report-row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding: 20px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit;
  }
  a.report-row:hover .report-title { color: var(--navy); }
  .report-date {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--gold); font-weight: 600; white-space: nowrap;
  }
  .report-title { font-weight: 600; font-size: 15.5px; }
  .report-arrow { color: var(--ink-faint); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<div class="wrap">
  <div class="eyebrow">Elaine Cristina Advocacia</div>
  <h1>Relatórios de campanhas</h1>
  <div class="subtitle">Acompanhamento periódico das campanhas de Google Ads, preparado pela Consultoria Tráfego ADS.</div>
  <div class="reco-list">
    <a class="report-row" href="/relatorios/2026-09-12.html">
      <span>
        <span class="report-date">12/09/2026</span><br>
        <span class="report-title">Relatório Quinzenal — Evolução da conta</span>
      </span>
      <span class="report-arrow">→</span>
    </a>
  </div>
</div>
</body>
</html>
